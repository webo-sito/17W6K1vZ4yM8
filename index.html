<title>GHANDAR SHOES</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Dancing+Script:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{--cream:#EFE8D7;--cream-2:#F6F1E5;--gold:#6B4712;--gold-2:#8A5E1C;--gold-light:#B4884A;--ink:#161412;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;min-height:100%;width:100%;background:var(--cream);font-family:'Poppins',-apple-system,sans-serif;-webkit-user-select:none;user-select:none;overscroll-behavior:none;}
  body{position:relative;overflow-x:hidden;}
  .blob{position:fixed;border-radius:50%;background:#E3D9C0;opacity:.55;z-index:0;pointer-events:none;}
  .blob-1{width:280px;height:280px;top:-120px;left:-100px;}
  .blob-2{width:320px;height:320px;bottom:-160px;right:-120px;}
  .frame{position:relative;z-index:1;margin:12px;min-height:calc(100vh - 24px);min-height:calc(100dvh - 24px);border:1.5px solid var(--gold-light);border-radius:22px;padding:22px 16px 18px;display:flex;flex-direction:column;justify-content:center;opacity:0;animation:frameIn .6s cubic-bezier(.19,1,.22,1) forwards .1s;}
  .frame::before{content:'';position:absolute;inset:6px;border:1px solid rgba(107,71,18,.35);border-radius:16px;pointer-events:none;}
  @keyframes frameIn{from{opacity:0;transform:scale(.97) translateY(6px);}to{opacity:1;transform:none;}}

  .header{text-align:center;padding-bottom:14px;}
  .logo{width:210px;max-width:62%;display:block;margin:0 auto 8px;}
  .tag{display:flex;align-items:center;justify-content:center;gap:10px;font-weight:700;font-size:11.5px;letter-spacing:3px;color:var(--gold);}
  .tag i{display:block;width:26px;height:1.5px;background:var(--gold-light);}

  .stack{display:flex;flex-direction:column;gap:10px;}
  .panel{border:1.3px solid var(--gold-light);border-radius:16px;padding:10px 14px 12px;background:var(--cream-2);text-align:center;}
  .title{font-family:'Dancing Script',cursive;font-weight:700;font-size:23px;color:var(--gold);line-height:1;margin:0 0 8px;}
  .row{display:flex;gap:8px;}

  .pay{flex:1;height:52px;border-radius:12px;background:#fff;border:1px solid #e7ddc7;display:flex;align-items:center;justify-content:center;padding:0 10px;text-decoration:none;transition:transform .15s;}
  .pay img{display:block;max-width:100%;max-height:30px;}
  .pay.v img{max-height:38px;}
  .pay:active,.chip:active,.social:active,.site:active{transform:scale(.96);}

  .chip{flex:1;display:flex;align-items:center;justify-content:center;gap:7px;min-height:46px;border-radius:12px;background:#fff;border:1px solid #e7ddc7;text-decoration:none;padding:6px 8px;transition:transform .15s;}
  .chip span{font-size:12.5px;font-weight:600;color:var(--ink);line-height:1.25;text-align:left;}

  .social{flex:1;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center;gap:9px;text-decoration:none;color:#fff;font-weight:600;font-size:13px;letter-spacing:.4px;transition:transform .15s;}
  .site{display:flex;align-items:center;justify-content:center;gap:9px;height:46px;border-radius:12px;background:linear-gradient(150deg,var(--gold-2),var(--gold));color:#fff;text-decoration:none;font-weight:600;font-size:13px;letter-spacing:.4px;transition:transform .15s;}
  @media (max-height:700px){.sq{width:50px;height:50px}.logo{width:170px}.header{padding-bottom:10px}.panel{padding:8px 12px 10px}.stack{gap:8px}.foot{margin-top:10px}}
  .soc-row{justify-content:center;gap:14px;}
  .sq{width:58px;height:58px;border-radius:14px;background:linear-gradient(150deg,var(--gold-2),var(--gold));display:flex;align-items:center;justify-content:center;text-decoration:none;transition:transform .15s;}
  .sq:active{transform:scale(.93);}
  .foot{text-align:center;margin-top:14px;font-size:10px;letter-spacing:2px;color:var(--gold-light);font-weight:600;}

  /* ===== LOADING SCREEN ===== */
  #loader{position:fixed;inset:0;z-index:9999;background:var(--cream);display:flex;align-items:center;justify-content:center;transition:opacity .7s ease,visibility .7s ease;}
  #loader.done{opacity:0;visibility:hidden;pointer-events:none;}
  #loader .blob{position:absolute;}
  #loader .ld-frame{position:absolute;inset:12px;border:1.5px solid var(--gold-light);border-radius:22px;pointer-events:none;}
  #loader .ld-frame::before{content:'';position:absolute;inset:6px;border:1px solid rgba(107,71,18,.35);border-radius:16px;}
  .ld-logo{position:relative;z-index:1;width:240px;max-width:70%;display:block;
    -webkit-mask-image:linear-gradient(90deg,#000 0,#000 45%,transparent 55%);mask-image:linear-gradient(90deg,#000 0,#000 45%,transparent 55%);
    -webkit-mask-size:250% 100%;mask-size:250% 100%;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;
    -webkit-mask-position:100% 0;mask-position:100% 0;
    animation:ldWrite 2.4s cubic-bezier(.45,.05,.35,1) forwards .3s;}
  @keyframes ldWrite{from{-webkit-mask-position:100% 0;mask-position:100% 0;}to{-webkit-mask-position:0 0;mask-position:0 0;}}
  html.ld-lock,html.ld-lock body{overflow:hidden;height:100%;}
  @media (prefers-reduced-motion:reduce){.ld-logo{animation-duration:.01s;}}
</style>
</head>
