<!DOCTYPE html>
<html lang="ar" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#000000">
<title>ادفع وقيّمنا</title>
<style>
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    height:100%;width:100%;
    overflow:hidden;
    position:fixed;
    inset:0;
    background:#000;
    overscroll-behavior:none;
    -webkit-user-select:none;
    user-select:none;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif;
    touch-action:manipulation;
  }

  /* ---------- Loading splash: crack forms, then the wall splits open ---------- */
  .splash{
    position:fixed;
    inset:0;
    z-index:9999;
    background:transparent;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    isolation:isolate;
  }
  .splash.done{display:none;}

  /* two wall halves — their inner edges share the same jagged points, so
     they tile seamlessly until they're pushed apart on .split */
  .wall{
    position:absolute;
    inset:0;
    background:#000;
    z-index:1;
    transition:transform 1.05s cubic-bezier(.22,1,.36,1);
    will-change:transform;
  }
  .wall-l{ clip-path:polygon(0% 0%, 51% 0%, 47% 12%, 53% 24%, 48% 36%, 52% 48%, 46% 60%, 53% 72%, 49% 84%, 51% 100%, 0% 100%); }
  .wall-r{ clip-path:polygon(100% 0%, 51% 0%, 47% 12%, 53% 24%, 48% 36%, 52% 48%, 46% 60%, 53% 72%, 49% 84%, 51% 100%, 100% 100%); }
  .splash.split .wall-l{ transform:translate3d(-105%,0,0) rotate(-1.2deg); }
  .splash.split .wall-r{ transform:translate3d(105%,0,0) rotate(1.2deg); }

  /* light bursting through the crack the instant it splits */
  .burst{
    position:absolute;
    top:50%;left:50%;
    width:6px;height:6px;
    margin:-3px 0 0 -3px;
    border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.95) 0%, rgba(255,255,255,.45) 35%, rgba(255,255,255,0) 70%);
    z-index:2;
    opacity:0;
    pointer-events:none;
  }
  .splash.split .burst{ animation:burstFlash .9s cubic-bezier(.22,1,.36,1) forwards; }
  @keyframes burstFlash{
    0%{opacity:0; transform:scale(1);}
    25%{opacity:1; transform:scale(30);}
    100%{opacity:0; transform:scale(90);}
  }

  .crack-content{
    position:absolute;
    inset:0;
    z-index:3;
    transition:opacity .45s ease, transform .5s cubic-bezier(.22,1,.36,1);
  }
  .splash.split .crack-content{ opacity:0; transform:scale(1.04); }
  .draw-svg{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    display:block;
    filter:drop-shadow(0 0 6px rgba(255,255,255,.25));
  }
  .credit{
    position:absolute;
    left:50%;top:50%;
    transform:translate(-50%,-50%);
    color:#fff;
    font-size:11px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    white-space:nowrap;
    text-shadow:0 1px 10px rgba(0,0,0,.85), 0 0 3px rgba(0,0,0,.6);
    opacity:0;
    transition:opacity .6s ease .1s;
    pointer-events:none;
  }
  .credit.show{ opacity:1; }
  @media (prefers-reduced-motion:reduce){
    .splash{display:none;}
  }

  /* ---------- Main page ---------- */
  .stage{
    position:fixed;
    inset:0;
    height:100vh;
    height:100dvh;
    width:100vw;
    background:#000;
  }
  .actions{
    position:absolute;
    left:0;right:0;
    bottom:calc(env(safe-area-inset-bottom, 0px) + 26px);
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:14px;
    padding:0 20px;
  }
  .btn{
    all:unset;
    box-sizing:border-box;
    display:flex;
    align-items:center;
    gap:14px;
    width:100%;
    max-width:340px;
    height:74px;
    padding:7px 24px 7px 7px;
    border-radius:999px;
    background:#111;
    box-shadow:0 14px 30px rgba(0,0,0,.5), inset 0 0 0 1px rgba(255,255,255,.06);
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;
    transition:transform .15s ease, opacity .5s ease, translate .5s cubic-bezier(.19,1,.22,1);
    opacity:0;
    translate:0 14px;
  }
  .actions.show .btn{opacity:1;translate:0 0;}
  .actions.show .btn:nth-of-type(1){transition-delay:.05s;}
  .actions.show .btn:nth-of-type(2){transition-delay:.16s;}
  .btn:active{transform:scale(.965);}
  .badge{
    width:60px;
    height:60px;
    border-radius:16px;
    background:#fff;
    display:flex;
    align-items:center;
    justify-content:center;
    flex:0 0 auto;
    overflow:hidden;
    padding:5px;
  }
  .badge img{
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }
  .brand-badge{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:2px;
    line-height:1;
  }
  .g-blue{color:#4285F4;}
  .g-red{color:#EA4335;}
  .g-yellow{color:#FBBC05;}
  .g-green{color:#34A853;}
  .google-word{font-size:16px;font-weight:700;white-space:nowrap;}
  .stars{font-size:10px;letter-spacing:1.5px;color:#F5A623;}
  .label{
    flex:1;
    text-align:center;
    color:#fff;
    font-weight:700;
    font-size:17px;
    letter-spacing:.3px;
    white-space:nowrap;
  }
</style>
</head>
